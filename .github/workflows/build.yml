name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore DeveloperBrowser.slnx
      - run: dotnet build DeveloperBrowser.slnx --configuration Release --no-restore
